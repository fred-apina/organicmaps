name: SDK AAR (build / publish to Maven Central)

# Builds the Organic Maps SDK AARs the offline_navigation Flutter plugin needs (all four ABIs, release, stripped):
# organicmaps-sdk and the module it depends on, organicmaps-sdk-location-core. Optionally uploads them to Maven
# Central via the Sonatype Central Portal as io.github.fred-apina:<artifact> (see android/groovy/fork-publishing.gradle).
#
# - publish=false (default): build-only validation; the AAR is attached as a
#   workflow artifact. Needs no secrets.
# - publish=true: signs and uploads STAGED deployments to the Central Portal, one per module (two in all).
#   Review and release BOTH at https://central.sonatype.com/publishing.
#   Requires these repository secrets:
#     MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   (Portal token)
#     SIGNING_KEY            (ascii-armored GPG private key)
#     SIGNING_KEY_ID         (last 8 chars of the long key id)
#     SIGNING_KEY_PASSWORD   (key passphrase)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to build/publish (e.g. 0.1.2)"
        required: true
        type: string
      publish:
        description: "Upload staged deployments to Maven Central"
        required: true
        type: boolean
        default: false

jobs:
  sdk-aar:
    name: Build SDK AAR ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure repository
        run: ./configure.sh

      - name: Set up Python (CMake needs 3.11 or newer)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sdk-aar-${{ runner.os }}

      - name: Build release AARs (all ABIs)
        if: ${{ !inputs.publish }}
        working-directory: android
        run: |
          ./gradlew :sdk:assembleRelease :sdk:location:core:assembleRelease \
            "-PsdkVersion=${{ inputs.version }}" \
            --no-configuration-cache

      - name: Check the native library in the AAR is stripped and the consumer rules are there
        if: ${{ !inputs.publish }}
        run: bash .github/scripts/check-sdk-aar.sh android/sdk/build/outputs/aar/sdk-release.aar

      - name: Upload AAR artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: organicmaps-sdk-${{ inputs.version }}
          path: |
            android/sdk/build/outputs/aar/*.aar
            android/sdk/location/core/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Verify the AAR before publishing it (native library stripped, consumer rules present)
        if: ${{ inputs.publish }}
        working-directory: android
        run: |
          ./gradlew :sdk:bundleReleaseAar "-PsdkVersion=${{ inputs.version }}" --no-configuration-cache
          bash ../.github/scripts/check-sdk-aar.sh sdk/build/outputs/aar/sdk-release.aar

      - name: Publish staged deployment to Maven Central
        if: ${{ inputs.publish }}
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :sdk:publishToMavenCentral :sdk:location:core:publishToMavenCentral \
            "-PsdkVersion=${{ inputs.version }}" \
            --no-configuration-cache
