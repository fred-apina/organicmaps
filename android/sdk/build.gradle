import com.vanniktech.maven.publish.AndroidSingleVariantLibrary

plugins {
  id 'com.android.library'
  // Publishes the SDK AAR (with sources + javadoc, Central-compliant POM) to
  // Maven Central via the Sonatype Central Portal. Active only when the
  // om.sdkVersion property is set (see the mavenPublishing block below).
  id 'com.vanniktech.maven.publish' version '0.34.0'
}

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"

android {
  namespace = 'app.organicmaps.sdk'

  buildFeatures {
    buildConfig = true
  }

  defaultConfig {
    externalNativeBuild {
      def pchFlag = 'OFF'
      if (project.hasProperty('pch')) pchFlag = 'ON'

      def njobs = ''
      if (project.hasProperty('njobs')) njobs = project.getProperty('njobs')

      def enableVulkanDiagnostics = 'OFF'
      if (project.hasProperty('enableVulkanDiagnostics')) {
        enableVulkanDiagnostics = project.getProperty('enableVulkanDiagnostics')
      }

      def enableTrace = 'OFF'
      if (project.hasProperty('enableTrace')) {
        enableTrace = project.getProperty('enableTrace')
      }

      cmake {
        cppFlags '-fexceptions', '-frtti'
        // There is no sense to enable sections without gcc's --gc-sections flag.
        cFlags '-fno-function-sections', '-fno-data-sections',
            '-Wno-extern-c-compat'
        arguments '-DANDROID_TOOLCHAIN=clang', '-DANDROID_STL=c++_static',
            '-DSKIP_TESTS=ON', '-DSKIP_TOOLS=ON', "-DUSE_PCH=$pchFlag",
            "-DNJOBS=$njobs", "-DENABLE_VULKAN_DIAGNOSTICS=$enableVulkanDiagnostics",
            "-DENABLE_TRACE=$enableTrace"
        targets 'organicmaps'
      }
    }

    // Use, for example, -Parm32 gradle parameter to build only for armeabi-v7a.
    ndk {
      abiFilters = new HashSet<>()
      if (project.hasProperty('arm32') || project.hasProperty('armeabi-v7a')) {
        abiFilters.add('armeabi-v7a')
      }
      if (project.hasProperty('arm64') || project.hasProperty('arm64-v8a')) {
        abiFilters.add('arm64-v8a')
      }
      if (project.hasProperty('x86')) {
        abiFilters.add('x86')
      }
      if (project.hasProperty('x86_64') || project.hasProperty('x64')) {
        abiFilters.add('x86_64')
      }
      if (abiFilters.isEmpty()) {
        abiFilters.add('armeabi-v7a')
        abiFilters.add('arm64-v8a')
        // For the emulator, chromebooks and some Intel Atom devices.
        abiFilters.add('x86_64')
        abiFilters.add('x86')
      }
      println('Building for ' + abiFilters + ' archs.')
    }

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  // Keep symbols for local debugging, but STRIP the published AAR: unstripped
  // RelWithDebInfo binaries are ~270 MB per ABI and exceed artifact limits.
  if (!project.hasProperty('om.sdkVersion')) {
    packagingOptions {
      doNotStrip "**/liborganicmaps.so"
    }
  }

  externalNativeBuild {
    cmake {
      version = '3.22.1+'
      buildStagingDirectory './nativeOutputs'
      path '../../CMakeLists.txt'
    }
  }

  compileOptions {
    coreLibraryDesugaringEnabled = true
  }
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

  implementation 'androidx.annotation:annotation:1.9.1'
  implementation 'androidx.core:core:1.17.0'
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
  implementation 'androidx.fragment:fragment:1.8.9'
  implementation 'androidx.lifecycle:lifecycle-process:2.9.4'

  testImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
}

// TODO: Running lint task triggers native build. Find a better solution.
project.afterEvaluate {
  boolean isLintRun = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('lint') }

  if (isLintRun) {
    tasks.findAll { task ->
      (task.name.startsWith('Native') || task.name.contains('CMake')) &&
          task.project == project
    }.each { nativeTask ->
      logger.warn("Disabling task ${nativeTask.path} because lint is running.")
      nativeTask.onlyIf { false }
    }
  }
}

// ── Maven Central publishing (io.github.fred-apina:organicmaps-sdk) ─────────
// Run:  ./gradlew -p android :sdk:publishToMavenCentral -Pom.sdkVersion=<v> \
//         --no-configuration-cache
// Credentials (CI secrets / ~/.gradle/gradle.properties):
//   mavenCentralUsername / mavenCentralPassword (Central Portal token)
//   signingInMemoryKey / signingInMemoryKeyId / signingInMemoryKeyPassword
mavenPublishing {
  coordinates('io.github.fred-apina', 'organicmaps-sdk',
      (project.findProperty('om.sdkVersion') ?: '0.0.0-SNAPSHOT').toString())
  configure(new AndroidSingleVariantLibrary("release", true, true))
  publishToMavenCentral()

  // Sign only when a key is configured, so plain builds need no secrets.
  if (project.hasProperty('signingInMemoryKey') || project.hasProperty('signing.keyId')) {
    signAllPublications()
  }

  pom {
    name = 'Organic Maps SDK for Android'
    description = 'Prebuilt Organic Maps engine (map rendering, offline routing, ' +
        'map downloads) consumed by the offline_navigation Flutter plugin.'
    url = 'https://github.com/fred-apina/offline_navigation'
    licenses {
      license {
        name = 'The Apache License, Version 2.0'
        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
      }
    }
    developers {
      developer {
        id = 'fred-apina'
        name = 'fred-apina'
        url = 'https://github.com/fred-apina/'
      }
    }
    scm {
      url = 'https://github.com/fred-apina/organicmaps/'
      connection = 'scm:git:git://github.com/fred-apina/organicmaps.git'
      developerConnection = 'scm:git:ssh://git@github.com/fred-apina/organicmaps.git'
    }
  }
}
